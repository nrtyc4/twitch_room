name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build with version
        env:
          VERSION: ${{ github.sha }}
        run: go build -ldflags "-X main.version=${VERSION}" -o /tmp/twitch-room .