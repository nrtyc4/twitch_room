services:
  db:
    restart: unless-stopped
    image: postgres:16-alpine
    container_name: twitch-room-db
    environment:
      POSTGRES_USER: twitch_room
      POSTGRES_PASSWORD: twitch_room
      POSTGRES_DB: twitch_room
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twitch_room -d twitch_room"]
      interval: 5s
      timeout: 5s
      retries: 10

  twitch-room:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Reported as twitch_room_app_info{version=...} by /metrics.
        # Override with APP_VERSION in .env (e.g. APP_VERSION=$(git describe --tags --always)).
        VERSION: ${APP_VERSION:-dev}
    container_name: twitch-room
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ALLOW_DEV_AUTH: "true"
      TWITCH_ROOM_AUTH_TOKEN: "dev-secret-token"
      DATABASE_DSN: "postgres://twitch_room:twitch_room@db:5432/twitch_room?sslmode=disable"
      WATCH_STATE_TTL_MINUTES: "5"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  prometheus:
    restart: unless-stopped
    build:
      context: ./deploy/prometheus
      dockerfile: Dockerfile
    image: twitch-room-prometheus:local
    container_name: twitch-room-prometheus
    ports:
      - "9090:9090"
    environment:
      # Same variable the service reads, so the scrape credential cannot drift
      # from the service's own token. Empty means /metrics is public.
      TWITCH_ROOM_AUTH_TOKEN: "dev-secret-token"
    volumes:
      - promdata:/prometheus
    depends_on:
      - twitch-room

  alertmanager:
    restart: unless-stopped
    build:
      context: ./deploy/alertmanager
      dockerfile: Dockerfile
    image: twitch-room-alertmanager:local
    container_name: twitch-room-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - alertmanagerdata:/alertmanager
    depends_on:
      - prometheus

volumes:
  pgdata:
  promdata:
  alertmanagerdata:
