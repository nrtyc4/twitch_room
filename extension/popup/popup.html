<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Room</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <img src="https://www.twitch.tv/favicon.ico" alt="User avatar" class="user-avatar" id="user-avatar">
      <div class="logo-area">
        <h1 class="logo-text">Watch Room</h1>
        <p class="logo-subtext" id="user-display">Not signed in</p>
      </div>
    </header>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <main>
      <div class="status-card">
        <h2>Current Status</h2>
        <div class="watching-info">
          <div class="pulse-container" id="pulse-container" style="display: none;">
            <div class="pulse-dot pulse-animation"></div>
            <span style="font-size: 0.7rem; color: var(--twitch-success);">LIVE</span>
          </div>
          <p id="watching-text" aria-live="polite">Not watching anything</p>
        </div>
        <p id="last-synced" class="last-synced">Never synced</p>
        <div class="form-group">
          <label for="channel-input">Currently watching (channel name or Twitch URL)</label>
          <input type="text" id="channel-input" list="recent-channels" placeholder="e.g. shroud or https://twitch.tv/shroud" aria-describedby="channel-hint">
          <datalist id="recent-channels"></datalist>
          <small id="channel-hint" class="hint">Enter a channel name or full Twitch URL.</small>
        </div>
        <div class="button-row">
          <button id="use-tab-btn" class="btn btn-secondary">Use current tab</button>
          <button id="sync-btn" class="btn" disabled>Sync Now</button>
        </div>
        <button id="copy-link-btn" class="btn btn-secondary">Copy Public Link</button>
        <div id="status-message" class="status-message" role="status" aria-live="polite"></div>
      </div>
    </main>

    <section class="feed-section" aria-label="Friends activity">
      <h3 class="feed-title">Friends Activity</h3>
      <div id="feed-container" class="feed-container">
        <p class="feed-empty-msg">Loading activity...</p>
      </div>
    </section>

    <section class="settings-section">
      <h3 class="settings-title">Account</h3>
      <div id="auth-status" class="status-message" aria-live="polite"></div>
      <div class="button-row">
        <button id="login-twitch-btn" class="btn">Login with Twitch</button>
        <button id="logout-twitch-btn" class="btn btn-secondary" style="display:none;">Logout</button>
      </div>

      <h3 class="settings-title">Manual Configuration</h3>
      <div class="form-group">
        <label for="client-id">Twitch Client ID</label>
        <input type="text" id="client-id" placeholder="Twitch app client id">
      </div>
      <div class="form-group">
        <label for="auth-token">Auth Token</label>
        <input type="password" id="auth-token" placeholder="Enter Bearer token">
      </div>
      <div class="form-group">
        <label for="user-id">User ID</label>
        <input type="text" id="user-id" placeholder="Enter your User ID">
      </div>
      <div class="form-group">
        <label>
          <input type="checkbox" id="privacy-consent">
          I accept the <a href="../privacy.html" target="_blank" rel="noopener">Privacy Policy</a> and consent to collection of my watch state.
        </label>
      </div>
      <button id="save-settings-btn" class="btn btn-secondary">Save Settings</button>
      <p class="disclaimer">Not affiliated with or endorsed by Twitch.</p>
    </section>
  </div>
  <script src="popup.js"></script>
</body>
</html>
