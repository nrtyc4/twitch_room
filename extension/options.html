<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Room - Options</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <h1>Watch Room Settings</h1>

    <section>
      <h2>Authentication</h2>
      <p id="auth-status">Not logged in.</p>
      <button id="login-btn" class="btn">Login with Twitch</button>
    <p class="disclaimer">Not affiliated with or endorsed by Twitch.</p>
      <button id="logout-btn" class="btn btn-secondary">Logout</button>
      <button id="delete-data-btn" class="btn btn-secondary">Delete my data</button>
      <p><a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a></p>
    </section>

    <section>
      <h2>Configuration</h2>
      <div class="form-group">
        <label for="client-id">Twitch Client ID</label>
        <input type="text" id="client-id" placeholder="Twitch app client id">
      </div>
      <div class="form-group">
        <label for="api-base">API Base URL</label>
        <input type="text" id="api-base" placeholder="http://localhost:8080">
      </div>
      <button id="save-btn" class="btn">Save</button>
      <button id="test-btn" class="btn btn-secondary">Test connection</button>
      <div id="status" class="status"></div>
    </section>
  </div>
  <script src="options.js"></script>
</body>
</html>
